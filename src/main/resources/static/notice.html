<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - UbiCOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; background: #f9fafb; color: #111827; }
        .deadline-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .deadline-toggle input { width: 16px; height: 16px; accent-color: #f97316; }
        .deadline-fields { display: flex; gap: 8px; margin-top: 8px; padding-left: 24px; }
        .deadline-fields input { flex: 1; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; outline: none; }
        .deadline-fields input:focus { border-color: #2563eb; }
        .badge-n { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; border-radius: 50%; margin-left: 6px; vertical-align: middle; }

        /* PAGE - 게시판과 동일한 최대 너비 및 패딩 기준 적용 */
        .page { width: 100%; max-w: 1152px; margin: 0 auto; padding: 36px 16px 60px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">
<!-- Header -->
<header class="bg-blue-600 text-white shadow-lg w-full">
    <div class="w-full px-6 flex items-center justify-between h-16">
        <button onclick="location.href='/'" class="text-2xl font-bold hover:text-blue-100 transition-colors cursor-pointer">UbiCOM</button>
        <nav class="hidden md:flex items-center gap-6">
            <a onclick="location.href='/notice'" class="hover:text-blue-100 transition-colors font-semibold cursor-pointer">공지사항</a>
            <a onclick="location.href='/calendar'" class="hover:text-blue-100 transition-colors cursor-pointer">학사일정</a>
            <a onclick="location.href='/board'" class="hover:text-blue-100 transition-colors cursor-pointer">게시판</a>
            <a onclick="location.href='/vote'" class="hover:text-blue-100 transition-colors cursor-pointer">투표</a>
            <div id="nav-buttons"></div>
        </nav>
        <!-- Mobile Menu Button -->
        <button class="md:hidden p-2 cursor-pointer" id="mobile-menu-btn">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>
    <!-- Mobile Navigation -->
    <nav id="mobile-menu" class="hidden md:hidden py-4 border-t border-blue-500 px-6">
        <div class="flex flex-col gap-3">
            <div id="mobile-main-nav" class="flex flex-col gap-3"></div>
            <div id="mobile-nav-buttons" class="flex flex-col gap-2 pt-2 border-t border-blue-500"></div>
        </div>
    </nav>
</header>

<!-- Main Content -->
<main class="flex-1">
    <div class="w-full max-w-[1152px] mx-auto px-4 py-9">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900 flex items-center gap-2.5 mb-1.5">
                    <!-- 공지사항을 상징하는 확성기 아이콘 -->
                    <svg class="w-7 h-7 text-blue-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path>
                    </svg>
                    공지사항
                </h1>
                <p class="text-sm text-gray-500">동아리 주요 소식을 확인하세요.</p>
            </div>
            <div id="admin-controls" class="hidden">
                <button id="create-notice-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span>새 공지 작성</span>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-6">
            <div class="relative">
                <input
                        type="text"
                        id="search-input"
                        placeholder="제목 또는 내용으로 검색..."
                        oninput="onSearch(this.value)"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white shadow-sm"
                >
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Notices List Table & Mobile Cards -->
        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
            <!-- PC 전용 테이블 -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="border-b border-gray-200 bg-gray-50 text-gray-600 text-xs font-semibold">
                        <th class="py-3 px-4 w-16 text-center">번호</th>
                        <th class="py-3 px-4">제목</th>
                        <th class="py-3 px-4 w-36 text-right">작성자</th>
                        <th class="py-3 px-4 w-28 text-center">작성일시</th>
                        <th class="py-3 px-4 w-20 text-center">조회수</th>
                    </tr>
                    </thead>
                    <tbody id="notice-list-pc" class="divide-y divide-gray-100 text-sm text-gray-800">
                    <tr><td colspan="5" class="text-center py-8 text-gray-400">공지사항을 불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 모바일 전용 카드 리스트 -->
            <div class="block md:hidden divide-y divide-gray-100" id="notice-list-mobile">
                <div class="text-center py-8 text-gray-400 text-sm">공지사항을 불러오는 중...</div>
            </div>
        </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-gray-800 text-white py-8 mt-auto">
    <div class="w-full px-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <p class="text-xl font-bold">UbiCOM</p>
            <p class="text-sm text-gray-400 mt-1">Ubiquitous Computing Club</p>
        </div>
        <div class="text-sm text-gray-400 text-center md:text-right">
            <p>&copy; 2026 UbiCOM. All rights reserved.</p>
        </div>
    </div>
</footer>

<!-- Create Notice Modal -->
<div id="create-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-2xl w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
            <h2 class="text-xl font-bold text-gray-900">새 공지사항 작성</h2>
            <button id="close-modal" class="text-gray-400 hover:text-gray-600 cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <form id="create-notice-form" class="space-y-4">
            <div id="modal-error" class="hidden p-3 bg-red-50 text-red-700 text-sm rounded-md border border-red-200"></div>

            <div>
                <label for="notice-title" class="block text-sm font-medium text-gray-700 mb-1">제목</label>
                <input
                        type="text"
                        id="notice-title"
                        required
                        placeholder="공지사항 제목을 입력하세요"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none"
                >
            </div>

            <div>
                <label for="notice-content" class="block text-sm font-medium text-gray-700 mb-1">내용</label>
                <textarea
                        id="notice-content"
                        rows="6"
                        required
                        placeholder="공지사항 내용을 상세히 입력하세요"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"
                ></textarea>
            </div>

            <!-- 📊 투표 첨부 옵션 -->
            <div class="pt-2 border-t border-gray-100">
                <label class="inline-flex items-center cursor-pointer">
                    <input
                            type="checkbox"
                            id="attach-poll-check"
                            onchange="togglePollForm(this.checked)"
                            class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                    >
                    <span class="ml-2 text-sm font-medium text-gray-800 flex items-center gap-1">
                        📊 투표 첨부하기
                    </span>
                </label>

                <!-- 투표 상세 입력 폼 -->
                <div id="poll-form-area" class="hidden mt-4 p-4 bg-gray-50 border border-gray-200 rounded-md space-y-4">
                    <div>
                        <label for="poll-question" class="block text-xs font-medium text-gray-600 mb-1">투표 질문 (미입력 시 공지 제목 사용)</label>
                        <input type="text" id="poll-question" placeholder="예: 이번 모임 참석 여부를 알려주세요" class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-md bg-white">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">선택지 목록</label>
                        <div id="poll-options-container" class="space-y-2">
                            <!-- JS 동적 생성 -->
                        </div>
                        <button type="button" onclick="addPollOptionField()" class="mt-2 text-xs text-blue-600 hover:text-blue-800 font-medium cursor-pointer">+ 선택지 추가</button>
                    </div>

                    <!-- 마감 시간 -->
                    <div>
                        <label class="deadline-toggle">
                            <input type="checkbox" id="fDeadlineToggle" onchange="toggleDeadlineFields()" />
                            <span>⏰ 마감 시간 설정</span>
                        </label>
                        <div class="deadline-fields hidden" id="deadlineFields">
                            <input type="date" id="fDate" />
                            <input type="time" id="fTime" value="23:59" style="max-width:120px;" />
                        </div>
                    </div>

                    <div class="flex items-center gap-4 text-xs text-gray-700 pt-2 border-t border-gray-200">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="poll-anonymous" class="mr-1.5 rounded text-blue-600"> 익명 투표
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="poll-multiple" class="mr-1.5 rounded text-blue-600"> 복수 선택 허용
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <button
                        type="button"
                        id="cancel-btn"
                        class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md font-medium transition-colors cursor-pointer"
                >
                    취소
                </button>
                <button
                        type="submit"
                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium transition-colors cursor-pointer"
                >
                    등록
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 🗑️ 커스텀 삭제 확인 모달 -->
<div id="delete-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-sm w-full p-6 shadow-xl text-center">
        <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 mx-auto flex items-center justify-center mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
        </div>
        <h3 class="text-lg font-bold text-gray-900 mb-2">공지사항 삭제</h3>
        <p class="text-sm text-gray-600 mb-6">정말로 이 공지사항을 삭제하시겠습니까?<br><span class="text-xs text-red-500">(첨부된 투표도 함께 삭제됩니다)</span></p>
        <div class="flex justify-center gap-3">
            <button onclick="closeDeleteModal()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md text-sm font-medium transition-colors cursor-pointer">
                취소
            </button>
            <button id="confirm-delete-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md text-sm font-medium transition-colors cursor-pointer">
                삭제하기
            </button>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/notice.js"></script>
<script src="js/poll.js"></script>
</body>
</html>
