<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - Ubicom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/csrf.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 font-sans">
<div class="text-center bg-white p-8 sm:p-12 rounded-3xl shadow-xl max-w-lg w-full border border-slate-100">
    <!-- 404 아이콘/일러스트 -->
    <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
        <i class="fa-solid fa-compass-drafting"></i>
    </div>

    <h1 class="text-7xl font-extrabold text-slate-900 tracking-tight mb-2">404</h1>
    <h2 class="text-2xl font-bold text-slate-800 mb-3">페이지를 찾을 수 없습니다</h2>
    <p class="text-slate-500 mb-8 text-sm sm:text-base leading-relaxed">
        요청하신 주소가 잘못 입력되었거나,<br class="hidden sm:block">
        삭제되어 더 이상 사용할 수 없는 페이지입니다.
    </p>

    <!-- 이동 버튼 그룹 -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button onclick="history.back()" class="w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition text-sm">
            <i class="fa-solid fa-arrow-left mr-2"></i>이전 페이지
        </button>
        <a href="/" class="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition text-sm shadow-md shadow-indigo-200">
            <i class="fa-solid fa-house mr-2"></i>메인으로 이동
        </a>
    </div>
</div>
</body>
</html>
