<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 - UbiCOM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f9fafb;color:#111827}

        /* PAGE - 대시보드와 동일한 최대 너비 및 패딩 기준 적용 */
        .page{width:100%;max-width:1152px;margin:0 auto;padding:36px 16px 60px}
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- Header -->
<header class="bg-blue-600 text-white shadow-lg w-full">
    <div class="w-full px-6 flex items-center justify-between h-16">
        <button onclick="location.href='/'" class="text-2xl font-bold hover:text-blue-100 transition-colors">UbiCOM</button>
        <nav class="hidden md:flex items-center gap-6">
            <a onclick="location.href='/notice'" class="hover:text-blue-100 transition-colors " style="cursor: pointer;">공지사항</a>
            <a onclick="location.href='/calendar'" class="hover:text-blue-100 transition-colors" style="cursor: pointer;">학사일정</a>
            <a onclick="location.href='/board'" class="hover:text-blue-100 transition-colors font-semibold" style="cursor: pointer;">게시판</a>
            <a onclick="location.href='/vote'" class="hover:text-blue-100 transition-colors " style="cursor: pointer;">투표</a>
            <div id="nav-buttons"></div>
        </nav>
        <!-- Mobile Menu Button -->
        <button class="md:hidden p-2" id="mobile-menu-btn">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>
    <!-- Mobile Navigation -->
    <nav id="mobile-menu" class="hidden md:hidden py-4 border-t border-blue-500 px-6">
        <div class="flex flex-col gap-3">
            <div id="mobile-main-nav" class="flex flex-col gap-3"></div>
            <div id="mobile-nav-buttons" class="flex flex-col gap-2 pt-2 border-t border-blue-500"></div>
        </div>
    </nav>
</header>

<!-- Main Content -->
<main class="flex-1">
    <div class="page">
        <div class="mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 flex items-center gap-2.5 mb-1.5">
                <!-- 소통/게시판을 상징하는 아이콘 -->
                <svg class="w-7 h-7 text-blue-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h10M7 16h6"></path>
                </svg>
                게시판
            </h1>
            <p class="text-sm text-gray-500">UbiCOM 회원들과 소통하고 정보를 공유하세요</p>
        </div>

        <!-- Search and Create -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <div class="relative flex-1">
                <input
                        type="text"
                        id="search-input"
                        placeholder="게시글 검색..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                >
                <svg class="absolute left-3 top-3 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>

            <button id="create-post-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-medium whitespace-nowrap transition-colors cursor-pointer">
                + 글 쓰기
            </button>
        </div>

        <!-- Posts Table & Mobile Cards -->
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
            <!-- PC 전용 테이블 -->
            <div class="hidden md:block overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 text-gray-700 text-xs uppercase font-semibold">
                    <tr>
                        <th class="py-3 px-4 text-center w-16">번호</th>
                        <th class="py-3 px-4 text-left">제목</th>
                        <th class="py-3 px-4 text-right w-28">작성자</th>
                        <th class="py-3 px-4 text-center w-36">작성일시</th>
                        <th class="py-3 px-4 text-center w-20">조회수</th>
                        <th class="py-3 px-4 text-center w-20">댓글</th>
                    </tr>
                    </thead>
                    <tbody id="posts-list-pc" class="divide-y divide-gray-200 text-sm text-gray-600">
                    <tr><td colspan="6" class="text-center py-8 text-gray-400">게시글을 불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 모바일 전용 카드 리스트 -->
            <div class="block md:hidden divide-y divide-gray-100" id="posts-list-mobile">
                <div class="text-center py-8 text-gray-400 text-sm">게시글을 불러오는 중...</div>
            </div>
        </div>
    </div>
</main>

<!-- Create Post Modal -->
<div id="create-modal" class="modal-overlay hidden">
    <div class="modal-content max-w-2xl bg-white p-6 rounded-lg shadow-xl">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold">새 게시글 작성</h2>
            <button id="close-modal" class="text-gray-500 hover:text-gray-700 cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div id="modal-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-md">
            <p class="text-sm text-red-800"></p>
        </div>

        <form id="create-post-form" class="space-y-4">
            <div>
                <label for="post-title" class="block text-sm font-medium text-gray-700 mb-2">제목</label>
                <input
                        type="text"
                        id="post-title"
                        placeholder="게시글 제목을 입력하세요"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        required
                >
            </div>

            <div>
                <label for="post-content" class="block text-sm font-medium text-gray-700 mb-2">내용</label>
                <textarea
                        id="post-content"
                        rows="8"
                        placeholder="게시글 내용을 입력하세요"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        required
                ></textarea>
            </div>

            <div class="flex items-center space-x-2">
                <input
                        type="checkbox"
                        id="anonymous-checkbox"
                        class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                >
                <label for="anonymous-checkbox" class="text-sm cursor-pointer">익명으로 작성하기</label>
            </div>
            <div class="flex items-center space-x-2">
                <input type="checkbox" id="secret-checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                <label for="secret-checkbox" class="text-sm cursor-pointer font-medium text-gray-700">🔒 비밀글로 작성</label>
            </div>

            <div class="flex justify-end gap-2">
                <button type="button" id="cancel-btn" class="px-6 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors cursor-pointer">취소</button>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md transition-colors cursor-pointer">작성하기</button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="bg-gray-800 text-white py-8 mt-auto">
    <div class="w-full px-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <p class="text-xl font-bold">UbiCOM</p>
            <p class="text-sm text-gray-400 mt-1">Ubiquitous Computing Club</p>
        </div>
        <div class="text-sm text-gray-400 text-center md:text-right">
            <p>&copy; 2026 UbiCOM. All rights reserved.</p>
        </div>
    </div>
</footer>

<script src="/js/csrf.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/board.js"></script>

</body>
</html>
